version: 2
updates:
  # Keeps the GitHub Actions in the release workflow current. The third-party
  # ones are pinned to a commit hash with the version in a comment; Dependabot
  # moves both together and opens one pull request a week for all of them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
